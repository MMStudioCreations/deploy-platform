name = "bymamstudio-api"
main = "src/index.ts"
compatibility_date = "2024-09-23"
compatibility_flags = ["nodejs_compat"]

[[routes]]
pattern = "api.bymamstudio.com/*"
zone_name = "bymamstudio.com"

[[d1_databases]]
binding = "DB"
database_name = "deploy-platform"
database_id = "6797a5c0-eca1-4b35-a2b0-a0172874d760"

[[r2_buckets]]
binding = "BUCKET"
bucket_name = "bymamstudio-templates"

# Secrets — set via: wrangler secret put <NAME>
# CF_ACCOUNT_ID       — Cloudflare account ID
# CF_API_TOKEN        — Cloudflare API token (Pages + DNS permissions)
# CF_GITHUB_TOKEN     — GitHub PAT (repo + read:user scopes required)
# GITHUB_OWNER        — GitHub username or org that will own the mam-* repos
# ANTHROPIC_API_KEY   — Reserved for future AI content assist
# ADMIN_EMAIL         — Email required in X-Admin-Email header on every request

[dev]
port = 8787
local_protocol = "http"
